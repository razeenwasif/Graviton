[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"

[profile.release]
strip = "symbols"

[profile.guest]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.dependencies]
graviton-proto = { path = "crates/graviton-proto" }
graviton-core = { path = "crates/graviton-core" }
graviton-vmm = { path = "crates/graviton-vmm" }
graviton-image = { path = "crates/graviton-image" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "fs", "time"] }
yaml-rust2 = { version = "0.13", default-features = false }
