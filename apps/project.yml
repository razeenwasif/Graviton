name: Graviton
options:
  bundleIdPrefix: dev.graviton
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  GravitonKit:
    path: GravitonKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  GravitonMac:
    type: application
    platform: macOS
    sources: [Mac]
    dependencies:
      - package: GravitonKit
    settings:
      base:
        PRODUCT_NAME: Graviton
        PRODUCT_BUNDLE_IDENTIFIER: dev.graviton.mac
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        # The app talks to gravitond's Unix socket in ~/Library/Application Support,
        # so it isn't sandboxed yet. Revisit with an XPC service before distribution.
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_KEY_CFBundleDisplayName: Graviton
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""

  GravitonIOS:
    type: application
    platform: iOS
    sources: [iOS]
    dependencies:
      - package: GravitonKit
    info:
      path: iOS/Info.plist
      properties:
        NSLocalNetworkUsageDescription: Graviton looks for Macs running gravitond on your network so you can pair with them and see their containers.
        NSBonjourServices: [_graviton._tcp]
        CFBundleURLTypes:
          - CFBundleURLName: dev.graviton.pair
            CFBundleURLSchemes: [graviton]
    settings:
      base:
        PRODUCT_NAME: Graviton
        PRODUCT_BUNDLE_IDENTIFIER: dev.graviton.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Graviton
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark

schemes:
  GravitonMac:
    build:
      targets: { GravitonMac: all }
    run:
      config: Debug
  GravitonIOS:
    build:
      targets: { GravitonIOS: all }
    run:
      config: Debug
