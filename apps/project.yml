name: Graviton
options:
  bundleIdPrefix: dev.graviton
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  GravitonKit:
    path: GravitonKit
  # Terminal emulator for the Terminal tab and the iPhone shell (MIT). 1.11.2 is the
  # last release that draws with CoreText; later ones need the Metal toolchain.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.11.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  GravitonMac:
    type: application
    platform: macOS
    sources: [Mac, Shared]
    dependencies:
      - package: GravitonKit
      - package: SwiftTerm
      - target: GravitonWidgetMac
        embed: true
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Graviton
        GravitonWidgetGroupID: "$(TeamIdentifierPrefix)group.dev.graviton.shared"
        CFBundleURLTypes:
          - CFBundleURLName: dev.graviton.url
            CFBundleURLSchemes: [graviton]
    # Debug signs ad hoc; Release signs with Developer ID (Config/Release.xcconfig).
    configFiles:
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: Graviton
        PRODUCT_BUNDLE_IDENTIFIER: dev.graviton.mac
        CODE_SIGN_ENTITLEMENTS: Mac/Graviton.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # The app talks to gravitond's Unix socket in ~/Library/Application Support,
        # so it isn't sandboxed yet (see the README's Releasing section).
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_KEY_CFBundleDisplayName: Graviton
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"

  GravitonWidgetMac:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget/GravitonWidget.swift
    dependencies:
      - package: GravitonKit
    info:
      path: Widget/Info-macOS.plist
      properties:
        CFBundleDisplayName: Graviton Widget
        GravitonWidgetGroupID: "$(TeamIdentifierPrefix)group.dev.graviton.shared"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: GravitonWidgetMac
        PRODUCT_BUNDLE_IDENTIFIER: dev.graviton.mac.widget
        CODE_SIGN_ENTITLEMENTS: Widget/GravitonWidgetMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"

  GravitonIOS:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      - package: GravitonKit
      - package: SwiftTerm
      - target: GravitonWidgetIOS
        embed: true
    # Automatic signing with your team (Config/iOS.xcconfig).
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: Graviton looks for Macs running gravitond on your network so you can pair with them and see their containers.
        NSBonjourServices: [_graviton._tcp]
        CFBundleURLTypes:
          - CFBundleURLName: dev.graviton.pair
            CFBundleURLSchemes: [graviton]
    settings:
      base:
        PRODUCT_NAME: Graviton
        PRODUCT_BUNDLE_IDENTIFIER: dev.graviton.ios
        CODE_SIGN_ENTITLEMENTS: iOS/Graviton.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Graviton
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark

  GravitonWidgetIOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/GravitonWidget.swift
    dependencies:
      - package: GravitonKit
    configFiles:
      Debug: Config/iOS.xcconfig
      Release: Config/iOS.xcconfig
    info:
      path: Widget/Info-iOS.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Graviton Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: GravitonWidgetIOS
        PRODUCT_BUNDLE_IDENTIFIER: dev.graviton.ios.widget
        CODE_SIGN_ENTITLEMENTS: Widget/GravitonWidgetIOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

schemes:
  GravitonMac:
    build:
      targets:
        GravitonMac: all
        GravitonWidgetMac: all
    run:
      config: Debug
  GravitonIOS:
    build:
      targets:
        GravitonIOS: all
        GravitonWidgetIOS: all
    run:
      config: Debug
