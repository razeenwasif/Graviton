<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="gvBg" cx="50%" cy="34%" r="76%">
      <stop offset="0" stop-color="#101324"/>
      <stop offset="0.52" stop-color="#05060C"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>

    <radialGradient id="gvNebulaIndigo" cx="44%" cy="42%" r="48%">
      <stop offset="0" stop-color="#7A89FF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#5B6BF0" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gvNebulaSky" cx="62%" cy="62%" r="42%">
      <stop offset="0" stop-color="#4BC3F7" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#7A89FF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gvRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="gvTop" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#5E6FD0"/>
      <stop offset="0.5" stop-color="#374288"/>
      <stop offset="1" stop-color="#1E2554"/>
    </linearGradient>
    <linearGradient id="gvTopInset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A5B4FC" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#4BC3F7" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="gvLeft" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#29326E"/>
      <stop offset="0.55" stop-color="#15193B"/>
      <stop offset="1" stop-color="#0A0C1E"/>
    </linearGradient>
    <linearGradient id="gvRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15193B"/>
      <stop offset="0.6" stop-color="#0A0C1D"/>
      <stop offset="1" stop-color="#04050E"/>
    </linearGradient>

    <radialGradient id="gvCubeCore" cx="50%" cy="48%" r="48%">
      <stop offset="0" stop-color="#4BC3F7" stop-opacity="0.52"/>
      <stop offset="0.45" stop-color="#7A89FF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7A89FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gvEdgeTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A89FF" stop-opacity="0.60"/>
      <stop offset="0.5" stop-color="#EEF2FF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#4BC3F7" stop-opacity="0.70"/>
    </linearGradient>
    <linearGradient id="gvEdgeCenter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C7F0FF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#7A89FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7A89FF" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="gvOrbitBackPrimary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4BC3F7" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#7A89FF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="gvOrbitFrontPrimary" x1="0.5" y1="0.5" x2="0.5" y2="1">
      <stop offset="0" stop-color="#7A89FF" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#4BC3F7" stop-opacity="0.88"/>
      <stop offset="0.6" stop-color="#4BC3F7" stop-opacity="1"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="gvOrbitFrontSpecular" x1="0.5" y1="0.5" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="gvOrbitFrontSecondary" x1="0.5" y1="0.5" x2="0.5" y2="1">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.24" stop-color="#A78BFA" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#7A89FF" stop-opacity="0.85"/>
    </linearGradient>

    <radialGradient id="gvParticleMainHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.18" stop-color="#C2F2FF" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#4BC3F7" stop-opacity="0.55"/>
      <stop offset="0.72" stop-color="#7A89FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7A89FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gvParticleSubHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="0.25" stop-color="#DDD6FE" stop-opacity="0.82"/>
      <stop offset="0.55" stop-color="#A78BFA" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>

    <filter id="gvShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="gvOrbitBloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="gvSoftGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <clipPath id="gvBack"><rect x="-300" y="-300" width="1624" height="816"/></clipPath>
    <clipPath id="gvFront"><rect x="-300" y="516" width="1624" height="808"/></clipPath>
    <clipPath id="gvCubeClip">
      <polygon points="512,300 686,400 686,602 512,702 338,602 338,400"/>
    </clipPath>
    <clipPath id="gvPlateClip">
      <rect width="1024" height="1024" rx="230"/>
    </clipPath>
  </defs>

  <g id="artwork" transform="translate(100 100) scale(0.8046875)" filter="url(#gvShadow)">
    <g clip-path="url(#gvPlateClip)">
      <rect id="plate" width="1024" height="1024" rx="230" fill="url(#gvBg)"/>
      <circle cx="440" cy="410" r="500" fill="url(#gvNebulaIndigo)"/>
      <circle cx="640" cy="630" r="440" fill="url(#gvNebulaSky)"/>

      <!-- Spacetime gravity-well quadrupole ripples -->
      <g transform="rotate(-20 512 516)" fill="none">
        <ellipse cx="512" cy="516" rx="255" ry="88" stroke="#7A89FF" stroke-opacity="0.14" stroke-width="2.5"/>
        <ellipse cx="512" cy="516" rx="315" ry="109" stroke="#7A89FF" stroke-opacity="0.10" stroke-width="2"/>
        <ellipse cx="512" cy="516" rx="435" ry="152" stroke="#4BC3F7" stroke-opacity="0.06" stroke-width="1.8"/>
      </g>

      <!-- Orbit back halves -->
      <g transform="rotate(28 512 516)" clip-path="url(#gvBack)">
        <ellipse cx="512" cy="516" rx="342" ry="108" fill="none" stroke="#A78BFA" stroke-opacity="0.28" stroke-width="10"/>
      </g>
      <g transform="rotate(-20 512 516)" clip-path="url(#gvBack)">
        <ellipse cx="512" cy="516" rx="374" ry="128" fill="none" stroke="url(#gvOrbitBackPrimary)" stroke-width="13"/>
      </g>

      <!-- Sculpted isometric container cube -->
      <g>
        <circle cx="512" cy="500" r="200" fill="url(#gvCubeCore)" filter="url(#gvSoftGlow)"/>

        <polygon points="512,300 686,400 512,500 338,400" fill="url(#gvTop)"/>
        <polygon points="512,326 641,400 512,474 383,400" fill="none" stroke="url(#gvTopInset)" stroke-width="2.5"/>

        <polygon points="338,400 512,500 512,702 338,602" fill="url(#gvLeft)"/>
        <g clip-path="url(#gvCubeClip)" stroke-linecap="round">
          <line x1="376" y1="442" x2="376" y2="604" stroke="#060814" stroke-opacity="0.60" stroke-width="11"/>
          <line x1="382" y1="445" x2="382" y2="607" stroke="#9AA8FF" stroke-opacity="0.18" stroke-width="3"/>

          <line x1="418" y1="466" x2="418" y2="628" stroke="#060814" stroke-opacity="0.60" stroke-width="11"/>
          <line x1="424" y1="469" x2="424" y2="631" stroke="#9AA8FF" stroke-opacity="0.20" stroke-width="3"/>

          <line x1="460" y1="490" x2="460" y2="652" stroke="#060814" stroke-opacity="0.60" stroke-width="11"/>
          <line x1="466" y1="493" x2="466" y2="655" stroke="#9AA8FF" stroke-opacity="0.22" stroke-width="3"/>
        </g>

        <polygon points="512,500 686,400 686,602 512,702" fill="url(#gvRight)"/>
        <g clip-path="url(#gvCubeClip)" stroke-linecap="round">
          <line x1="564" y1="490" x2="564" y2="652" stroke="#000000" stroke-opacity="0.68" stroke-width="11"/>
          <line x1="558" y1="493" x2="558" y2="655" stroke="#7A89FF" stroke-opacity="0.14" stroke-width="2.5"/>

          <line x1="606" y1="466" x2="606" y2="628" stroke="#000000" stroke-opacity="0.68" stroke-width="11"/>
          <line x1="600" y1="469" x2="600" y2="631" stroke="#7A89FF" stroke-opacity="0.12" stroke-width="2.5"/>

          <line x1="648" y1="442" x2="648" y2="604" stroke="#000000" stroke-opacity="0.68" stroke-width="11"/>
          <line x1="642" y1="445" x2="642" y2="607" stroke="#7A89FF" stroke-opacity="0.10" stroke-width="2.5"/>
        </g>

        <circle cx="512" cy="500" r="145" fill="url(#gvCubeCore)" clip-path="url(#gvCubeClip)"/>

        <polyline points="338,400 512,300 686,400" fill="none" stroke="url(#gvEdgeTop)" stroke-width="3.5" stroke-linejoin="round"/>
        <polyline points="338,400 512,500 686,400" fill="none" stroke="#C7D2FE" stroke-opacity="0.54" stroke-width="3" stroke-linejoin="round"/>
        <line x1="512" y1="500" x2="512" y2="702" stroke="url(#gvEdgeCenter)" stroke-width="3"/>
        <polygon points="512,300 686,400 686,602 512,702 338,602 338,400" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
      </g>

      <!-- Secondary orbit front half -->
      <g transform="rotate(28 512 516)" clip-path="url(#gvFront)">
        <ellipse cx="512" cy="516" rx="342" ry="108" fill="none" stroke="url(#gvOrbitFrontSecondary)" stroke-opacity="0.35" stroke-width="18" filter="url(#gvOrbitBloom)"/>
        <ellipse cx="512" cy="516" rx="342" ry="108" fill="none" stroke="url(#gvOrbitFrontSecondary)" stroke-width="10"/>
        <circle cx="772" cy="586" r="42" fill="url(#gvParticleSubHalo)"/>
        <circle cx="772" cy="586" r="11.5" fill="#FFFFFF"/>
      </g>

      <!-- Primary orbit front half + radiant white-hot graviton particle -->
      <g transform="rotate(-20 512 516)" clip-path="url(#gvFront)">
        <ellipse cx="512" cy="516" rx="374" ry="128" fill="none" stroke="url(#gvOrbitFrontPrimary)" stroke-opacity="0.42" stroke-width="26" filter="url(#gvOrbitBloom)"/>
        <ellipse cx="512" cy="516" rx="374" ry="128" fill="none" stroke="url(#gvOrbitFrontPrimary)" stroke-width="14"/>
        <ellipse cx="512" cy="516" rx="374" ry="128" fill="none" stroke="url(#gvOrbitFrontSpecular)" stroke-width="3.5"/>

        <circle cx="204" cy="588" r="88" fill="url(#gvParticleMainHalo)"/>
        <circle cx="204" cy="588" r="24" fill="#FFFFFF"/>
      </g>

      <rect x="2.5" y="2.5" width="1019" height="1019" rx="227.5" fill="none" stroke="url(#gvRim)" stroke-width="5"/>
    </g>
  </g>
</svg>
